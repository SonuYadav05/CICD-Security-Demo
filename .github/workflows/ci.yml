name: DEMO-CICD

on:
  push:
    branches:
      - main

# Least privilege: jobs can only read the repo
permissions:
  contents: read

jobs:

  # Stage 1: download the code
  checkout:
    name: Checkout Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

  # Stage 2: look for leaked passwords and keys in the git history
  gitleaks:
    name: Gitleaks Scan
    needs: checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Stage 3: check HTML style
  lint:
    name: HTML Lint
    needs: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  # Stage 4: simple test
  unit-test:
    name: Unit Test
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  # Stage 5: SonarQube code scan, then wait for the Quality Gate result.
  # The pipeline stops here if the Quality Gate fails.
  sonarqube:
    name: SonarQube + Quality Gate
    needs: unit-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # Stage 6: works out today's date and the next revision number (.1, .2, .3 ...)
  prepare-tag:
    name: Create Image Tag
    needs: sonarqube
    runs-on: ubuntu-latest
    outputs:
      tag_date: ${{ steps.tag.outputs.tag_date }}
      revision: ${{ steps.tag.outputs.revision }}
    steps:
      - name: Work out date and next revision
        id: tag
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -eu

          DATE=$(date -u +%Y-%m-%d)

          JWT=$(jq -n --arg u "$DH_USER" --arg p "$DH_TOKEN" '{username:$u,password:$p}' \
            | curl -s -H "Content-Type: application/json" -d @- https://hub.docker.com/v2/users/login \
            | jq -r '.token // empty')

          if [ -z "$JWT" ]; then
            echo "Could not log in to Docker Hub. Check DOCKERHUB_USERNAME and DOCKERHUB_TOKEN."
            exit 1
          fi

          MAX=0
          URL="https://hub.docker.com/v2/repositories/$DH_USER/frontend/tags?page_size=100&name=latest-$DATE"

          while [ -n "$URL" ]; do
            RESP=$(curl -s -H "Authorization: JWT $JWT" "$URL")

            for NAME in $(echo "$RESP" | jq -r '.results[]?.name'); do
              if [[ "$NAME" =~ ^latest-${DATE}\.([0-9]+)-(amd|arm)$ ]]; then
                NUM="${BASH_REMATCH[1]}"
                if [ "$NUM" -gt "$MAX" ]; then
                  MAX="$NUM"
                fi
              fi
            done

            URL=$(echo "$RESP" | jq -r '.next // empty')
          done

          REVISION=$((MAX + 1))

          echo "tag_date=$DATE" >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "Next tag will be: latest-$DATE.$REVISION-amd and latest-$DATE.$REVISION-arm"
            # Stage 7: build one image per architecture and push to Docker Hub
  docker-build:
    name: Docker Build and Push (${{ matrix.suffix }})
    needs: prepare-tag
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd
          - platform: linux/arm64
            suffix: arm

    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/frontend
      TAG_DATE: ${{ needs.prepare-tag.outputs.tag_date }}
      REVISION: ${{ needs.prepare-tag.outputs.revision }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.suffix }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE }}:latest-${{ env.TAG_DATE }}.${{ env.REVISION }}-${{ matrix.suffix }}
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}

